server:
  port: 8085
  forward-headers-strategy: framework
  # Boot 2.2 부터 기본값이 false 라 톰캣 ThreadPool MBean 이 등록되지 않고, Micrometer 의
  # tomcat.threads.* 바인딩이 통째로 빈다(#500). 스레드 포화를 수치로 볼 수단이라 켠다.
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: payment-service
  # payment-service는 Redis를 쓰지 않는다. common의 redis 스타터가 전이돼 오토컨피그가 뜨는 것을 막는다(#425).
  # FQCN 은 Boot 4.0 에서 boot.autoconfigure.data.redis → boot.data.redis.autoconfigure 로 옮겨졌고
  # 클래스명도 DataRedis* 로 바뀌었다. 클래스패스에 없는 exclude 는 예외 없이 조용히 무시되므로
  # (AutoConfigurationImportSelector#checkExcludedClasses) 구 이름을 남겨두면 이 줄이 통째로 죽는다(#500).
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  jpa:
    open-in-view: false
  # payment 에 @Scheduled 가 생긴 것은 #574 가 처음이다. 기본 풀은 스레드 1개라 스케줄러가 늘면
  # 서로 지연을 밀어낸다. 지금 스케줄러는 1개뿐이지만, 이 작업은 브로커 대기로 스레드를 길게 물 수
  # 있어(그래서 연속 실패 시 주기를 접는다) 다음 스케줄러가 생겼을 때 그 지연을 물려받지 않도록
  # 한 칸을 미리 둔다.
  task:
    scheduling:
      pool:
        size: 2

app:
  event-publisher:
    type: kafka
  # 미해결 환불 실패(FAILED 환불 이력)의 보상 신호를 booking 에 되풀이해 알린다(#574).
  # 환경 무관 설정이라 base 에 둔다(backend-convention §프로파일 및 인프라 접속정보 외부화).
  refund-signal-replay:
    # 끄면 유실된 보상 건이 미해결 목록·관리자 재환불 API 에 영영 잡히지 않는다. 끌 때 그 대가를 안다는
    # 전제이며, 되돌리려면 재기동이 필요하다.
    enabled: ${REFUND_SIGNAL_REPLAY_ENABLED:true}
    # 원 발행이 성공하면 게이트는 즉시 열리므로 이 주기는 유실됐을 때만 의미가 있다. 단 한 주기가
    # batch-size 만큼만 훑고 커서로 이어 읽으므로, 실제 복구 지연 상한은 이 값이 아니라
    # ceil(미해결 건수 / batch-size) × interval 이다(미해결 1,000건이면 50분).
    interval-ms: ${REFUND_SIGNAL_REPLAY_INTERVAL_MS:300000}
    # PG 장애로 FAILED 가 대량으로 쌓였을 때 한 주기에 전부 발행하지 않도록 상한을 둔다. 올리면 한 바퀴가
    # 짧아지는 대신 한 주기가 스케줄러 스레드를 오래 문다.
    batch-size: ${REFUND_SIGNAL_REPLAY_BATCH_SIZE:100}
  # 결제 확정 신호가 유실돼 과금만 남은 만료 예매를 찾아 자동 환불한다(#607).
  charged-expired-recovery:
    # 기본값이 false 인 것은 위 refund-signal-replay 와 다르며, 차이는 이 작업에 PG 환불이라는 되돌릴 수
    # 없는 부작용이 있다는 것이다. 켜는 순간 첫 랩이 과거에 쌓인 사고 건을 전량 환불하므로, 잔량을 실측하고
    # 그 규모를 알고 켠다(ADR 0015 · #441). 끄면 사고 건이 어떤 목록에도 잡히지 않는 상태로 남는다.
    enabled: ${CHARGED_EXPIRED_RECOVERY_ENABLED:false}
    # 만료 5 분 뒤부터 대상이 되지만 그 직후는 정상 처리가 늦게 도착하는 중일 수 있다. 이 주기 자체보다
    # grace-minutes 가 실질 탐지 지연을 결정한다.
    interval-ms: ${CHARGED_EXPIRED_RECOVERY_INTERVAL_MS:60000}
    # expired_booking 은 해결돼도 행이 남아 한 바퀴 길이가 누적 만료 건수에 비례한다. 실제 복구 지연
    # 상한은 interval 이 아니라 ceil(만료 건수 / batch-size) × interval 이다.
    # 아래 셋 모두 0 이나 음수면 기동이 실패한다. 0 은 "제한 없음"이 아니라 고장이기 때문이다(#573).
    batch-size: ${CHARGED_EXPIRED_RECOVERY_BATCH_SIZE:500}
    # 만료 직후 창을 환불로 덮지 않기 위한 유예. 확정 신호가 늦게 도착해 예매가 되살아나는 일은 없지만
    # (EXPIRED 는 종결 상태다), 취소·환불 등 다른 경로가 같은 건을 정리하는 중일 수 있다. 줄이면 복구가
    # 빨라지는 대신 경합 구간이 넓어진다.
    grace-minutes: ${CHARGED_EXPIRED_RECOVERY_GRACE_MINUTES:30}
    # 한 주기에 PG 취소를 호출하는 최대 건수. batch-size 와 다른 축이다 — 그쪽은 만료 테이블을 훑는
    # 크기이고 이쪽은 실제 결제 취소 호출 수다. Toss 는 429 대신 연속 요청 제한(403
    # FORBIDDEN_CONSECUTIVE_REQUEST)을 내는데, 그 코드가 가장 나오기 쉬운 구간이 대량 보상 환불
    # 버스트다. 거기 걸린 건은 FAILED 이력이 남아 자동 복구에서 영구히 빠지므로, 첫 랩에 백로그를
    # 몰아 던지지 않도록 상한을 둔다. 상한에 걸리면 그 자리에 커서를 두고 다음 주기가 이어받는다.
    max-refunds-per-lap: ${CHARGED_EXPIRED_RECOVERY_MAX_REFUNDS_PER_LAP:50}

service:
  ticket:
    # 결제 취소 경로의 입장권 사용 여부 판정 전용 (#416).
    # 내부 API(/api/v1/internal/ticket/**)는 게이트웨이가 라우팅하지 않으므로(#367),
    # ticket-service '직접' 주소여야 한다. 게이트웨이 주소로 넣으면 라우트 없음 404가 나
    # 미발급(TICKET_404_001)이 아닌 404로 취소가 전건 503 거부된다.
    url: ${TICKET_SERVICE_URL:http://localhost:8087}
    # 단일 행 조회이므로 공용 예산(3s/10s)을 쓰지 않는다 —
    # ticket-service가 느려질 때 취소 요청이 톰캣 스레드를 오래 붙잡아 결제 경로까지 마르는 것을 막는다.
    connect-timeout-ms: ${TICKET_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${TICKET_HTTP_READ_TIMEOUT_MS:2000}
  booking:
    # 결제 확정 전 예매 상태 동기 확인 전용 (#490).
    # ticket과 마찬가지로 내부 API(/api/v1/internal/booking/**)는 게이트웨이가 라우팅하지 않으므로
    # (ADR 0002) booking-service '직접' 주소여야 한다. 게이트웨이 주소로 넣으면 라우트 없음 404가 나
    # 예매 없음(BOOKING_404_001)이 아닌 404로 결제 확정이 전건 503 거부된다.
    url: ${BOOKING_SERVICE_URL:http://localhost:8084}
    # 단일 행 조회이므로 공용 예산(3s/10s)을 쓰지 않는다. read-timeout은 곧 톰캣 스레드의 최대 점유
    # 시간이고, 이 조회는 fail-closed라 booking이 느려지면 결제 경로가 그대로 마른다. 1s 근거는
    # ticket-service가 같은 엔드포인트에 쓰는 값과 그 근거인 #402 실측 왕복 3.20ms다.
    connect-timeout-ms: ${BOOKING_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${BOOKING_HTTP_READ_TIMEOUT_MS:1000}

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8085}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, booking/performance/user/auth 서비스와 동일).
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

payment:
  pg:
    stub:
      enabled: ${PAYMENT_PG_STUB_ENABLED:false}
    toss:
      enabled: ${TOSS_PAYMENTS_ENABLED:false}
      base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      connect-timeout-ms: ${TOSS_PAYMENTS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${TOSS_PAYMENTS_READ_TIMEOUT_MS:10000}
      # 재시도 가능한 취소 거절(#573)을 다시 호출하기 전 대기(ms). 겸 킬 스위치다 — 0 이하면 대기만
      # 생략하는 것이 아니라 재시도 자체를 하지 않고 기존 확정 경로(FAILED 이력 + 보상)로 낙하한다.
      # 대량 만료 버스트에서 컨슈머 스레드 점유로 max.poll.interval.ms가 압박되면 0으로 끈다.
      # 생성자 주입이라 변경에는 재기동이 필요하다(재기동은 컨슈머 리밸런스를 유발한다).
      cancel-retry-delay-ms: ${TOSS_PAYMENTS_CANCEL_RETRY_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). percentiles-histogram(true)은 Micrometer 사전정의
  # 버킷을 깔아 le 수를 통제할 수 없어 쓰지 않는다 — 앱 8개가 mem_limit 384m Prometheus 하나로
  # 모인다(ADR 0007). slo만 주면 버킷 = 지정 11개 + Inf 로 고정된다. 하단이 촘촘한 근거는 #402
  # 실측 서버측 평균(qr 1.30 / verify 4.27 / check-in 11.65ms)이다. Duration은 정수만 받는다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
