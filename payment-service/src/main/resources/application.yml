server:
  port: 8085
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: payment-service
  jpa:
    open-in-view: false

app:
  event-publisher:
    type: kafka

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8085}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

payment:
  pg:
    stub:
      enabled: ${PAYMENT_PG_STUB_ENABLED:false}
    toss:
      enabled: ${TOSS_PAYMENTS_ENABLED:false}
      base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
      connect-timeout-ms: ${TOSS_PAYMENTS_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${TOSS_PAYMENTS_READ_TIMEOUT_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
