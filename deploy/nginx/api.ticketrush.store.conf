upstream ticketrush_actuator {
    # 새 배포본의 관리 포트
    server 127.0.0.1:8090 max_fails=1 fail_timeout=1s;

    # 기존 배포본 전환 기간용
    server 127.0.0.1:8080 backup;
}

server {

    server_name api.ticketrush.store;

    # 공연 등록 멀티파트 업로드(#636). 지시어가 없으면 nginx 기본값이 1MB 라, 포스터 한 장도
    # 앱에 닿기 전에 413 HTML 로 잘린다 — MaxUploadSizeExceededException 핸들러도, FileKind 상한도,
    # ApiResponse 규격도 그 앞에서 무의미해진다.
    #
    # 12m 인 근거: 앱의 파일당 상한이 10MB(spring.servlet.multipart.max-file-size) 이고,
    # 멀티파트 경계·JSON 파트 오버헤드를 감안해 여유를 둔 값이다. 상한 초과 판정은 앱이 하도록
    # 남겨 둔다(그래야 팀 표준 ApiResponse 형식의 413 이 나간다).
    client_max_body_size 12m;

    location = /actuator/health {
        proxy_pass http://ticketrush_actuator/actuator/health;
        proxy_http_version 1.1;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Rate Limit 공통 429 응답 (#423)
    #
    # Nginx limit_conn에서 발생한 429도 Gateway의 ApiResponse와
    # 동일한 형식으로 반환한다.
    #
    # proxy_intercept_errors의 기본값은 off이므로,
    # Gateway가 자체적으로 반환한 429 응답은 여기서 덮어쓰지 않는다.
    # ============================================================
    error_page 429 = @rate_limit_json;

    location @rate_limit_json {
        default_type application/json;
        charset utf-8;

        return 429 '{"is_success":false,"code":"COMMON_429","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
    }

    # ============================================================
    # Toss Payments Webhook IP Allowlist (#423)
    #
    # webhook은 PG가 서버 간 호출하는 엔드포인트이므로
    # Gateway Redis RequestRateLimiter 대상에서 제외한다.
    #
    # 대신 인터넷 진입점인 Nginx에서 Toss Payments가 공식 공개한
    # inbound IP만 허용한다.
    #
    # `/webhook`과 `/webhook/` 모두 이 location에서 잡아
    # trailing slash로 allowlist를 우회할 수 없도록 한다.
    # ============================================================
    location ~ ^/api/v1/payment/webhook/?$ {
        # Toss Payments 공식 inbound IP
        allow 13.124.18.147;
        allow 13.124.108.35;
        allow 3.36.173.151;
        allow 3.38.81.32;
        allow 115.92.221.121;
        allow 115.92.221.122;
        allow 115.92.221.123;
        allow 115.92.221.125;
        allow 115.92.221.126;
        allow 115.92.221.127;

        deny all;

        # Toss webhook은 POST 요청만 사용한다.
        # 허용 IP라고 하더라도 다른 HTTP method는 차단한다.
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 좌석 상태 SSE 구독 — 아래 location / 로는 인터넷에서 도달할 수 없었다(#403).
    #
    # nginx 는 기본값 proxy_buffering on 이라 업스트림 응답을 버퍼에 모았다가 내보낸다. 요청/응답이
    # 한 번에 끝나는 API 에서는 문제가 없지만 SSE 는 커넥션을 열어둔 채 이벤트를 조금씩 흘리는
    # 방식이라, 버퍼가 차거나 커넥션이 끊길 때까지 클라이언트에 아무것도 도달하지 않는다.
    # 게이트웨이(8080)에 직접 붙으면 event:connected 가 즉시 오는데 https 로는 헤더조차 오지
    # 않았고, 인터넷에 열린 포트는 nginx 443 하나뿐이라 이 기능은 외부에서 쓸 수 없는 상태였다.
    # 게이트웨이 라우트 자체는 이미 있다(seat-sse-service, response-timeout: -1) — 막힌 곳은 여기다.
    #
    # proxy_read_timeout 은 SseEmitter 타임아웃(30분, SeatStatusSseSubscriber.java:14)보다 커야
    # 한다. 기본값 60s 면 서버가 정상으로 여기는 커넥션을 nginx 가 먼저 끊는다.
    #
    # #423:
    # Gateway의 RequestRateLimiter는 SSE 연결/재연결 시도 횟수를 제한하고,
    # Nginx limit_conn은 실제로 현재 살아 있는 SSE 연결 개수를 제한한다.
    #
    # nginx.conf에서 정의한 sse_global zone을 사용하여 현재 단일 인스턴스의
    # SSE 전체 동시 연결 수를 100개로 제한한다.
    #
    # 정규식 location 은 prefix location 보다 먼저 평가되므로 아래 location / 보다 이 블록이 이긴다
    # (선언 순서와 무관하지만, 읽는 사람을 위해 앞에 둔다).
    location ~ ^/api/v1/seat/[^/]+/seat-status/stream$ {
        # 현재 살아 있는 SSE 동시 연결 수 제한
        limit_conn sse_global 100;

        # Nginx 기본값은 503이지만, 요청 제한 의미에 맞게 429로 반환한다.
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # backlog 는 커널의 accept 큐 크기다. 지정하지 않으면 nginx 기본값 511 이 잡히고,
    # net.core.somaxconn(4096)이 아무리 커도 511 에서 잘린다. #555 계단 회차(2026-08-14)에서
    # 네 회차 모두 유입의 17~20% 가 대기열 진입에 실패했는데, k6 의 실패 status 가 전부 0
    # (HTTP 응답 없음 = 전송 계층)이었고 로그는 'connect: connection refused' 1,650건이었다.
    # 대상 커널은 ListenOverflows 0 / TCPReqQFullDoCookies 15,826 을 찍었다 — accept 큐가 아니라
    # SYN 큐가 벽이었다. 둘은 함께 올려야 한다(sysctl 은 deploy/sysctl/99-ticketrush.conf).
    listen 443 ssl backlog=4096; # managed by Certbot
    listen [::]:443 ssl ipv6only=on backlog=4096; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.ticketrush.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.ticketrush.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.ticketrush.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name api.ticketrush.store;
    return 404; # managed by Certbot
}