upstream ticketrush_actuator {
    # 새 배포본의 관리 포트
    server 127.0.0.1:8090 max_fails=1 fail_timeout=1s;

    # 기존 배포본 전환 기간용
    server 127.0.0.1:8080 backup;
}

server {

    server_name api.ticketrush.store;

    location = /actuator/health {
        proxy_pass http://ticketrush_actuator/actuator/health;
        proxy_http_version 1.1;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 좌석 상태 SSE 구독 — 아래 location / 로는 인터넷에서 도달할 수 없었다(#403).
    #
    # nginx 는 기본값 proxy_buffering on 이라 업스트림 응답을 버퍼에 모았다가 내보낸다. 요청/응답이
    # 한 번에 끝나는 API 에서는 문제가 없지만 SSE 는 커넥션을 열어둔 채 이벤트를 조금씩 흘리는
    # 방식이라, 버퍼가 차거나 커넥션이 끊길 때까지 클라이언트에 아무것도 도달하지 않는다.
    # 게이트웨이(8080)에 직접 붙으면 event:connected 가 즉시 오는데 https 로는 헤더조차 오지
    # 않았고, 인터넷에 열린 포트는 nginx 443 하나뿐이라 이 기능은 외부에서 쓸 수 없는 상태였다.
    # 게이트웨이 라우트 자체는 이미 있다(seat-sse-service, response-timeout: -1) — 막힌 곳은 여기다.
    #
    # proxy_read_timeout 은 SseEmitter 타임아웃(30분, SeatStatusSseSubscriber.java:14)보다 커야
    # 한다. 기본값 60s 면 서버가 정상으로 여기는 커넥션을 nginx 가 먼저 끊는다.
    #
    # 정규식 location 은 prefix location 보다 먼저 평가되므로 아래 location / 보다 이 블록이 이긴다
    # (선언 순서와 무관하지만, 읽는 사람을 위해 앞에 둔다).
    location ~ ^/api/v1/seat/[^/]+/seat-status/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # backlog 는 커널의 accept 큐 크기다. 지정하지 않으면 nginx 기본값 511 이 잡히고,
    # net.core.somaxconn(4096)이 아무리 커도 511 에서 잘린다. #555 계단 회차(2026-08-14)에서
    # 네 회차 모두 유입의 17~20% 가 대기열 진입에 실패했는데, k6 의 실패 status 가 전부 0
    # (HTTP 응답 없음 = 전송 계층)이었고 로그는 'connect: connection refused' 1,650건이었다.
    # 대상 커널은 ListenOverflows 0 / TCPReqQFullDoCookies 15,826 을 찍었다 — accept 큐가 아니라
    # SYN 큐가 벽이었다. 둘은 함께 올려야 한다(sysctl 은 deploy/sysctl/99-ticketrush.conf).
    listen 443 ssl backlog=4096; # managed by Certbot
    listen [::]:443 ssl ipv6only=on backlog=4096; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.ticketrush.store/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.ticketrush.store/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.ticketrush.store) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name api.ticketrush.store;
    return 404; # managed by Certbot


}