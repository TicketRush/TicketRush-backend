name: ticketrush-prod

services:
  mysql:
    image: mysql:8.0
    container_name: ticketrush-mysql
    mem_limit: 768m
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/001-ticket-rush-schema.sql:/docker-entrypoint-initdb.d/001-ticket-rush-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ticketrush-network

  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    mem_limit: 128m
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketrush-network

  kafka-volume-init:
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka-volume-init
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        chown -R 1000:1000 /tmp/kraft-combined-logs &&
        chmod -R u+rwX,g+rwX /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - ticketrush-network

  user-service:
    image: ${ECR_REGISTRY}/ticketrush/user-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: user-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  auth-service:
    image: ${ECR_REGISTRY}/ticketrush/auth-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: auth-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - ticketrush-network

  performance-service:
    image: ${ECR_REGISTRY}/ticketrush/performance-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: performance-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  booking-service:
    image: ${ECR_REGISTRY}/ticketrush/booking-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: booking-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

  payment-service:
    image: ${ECR_REGISTRY}/ticketrush/payment-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: payment-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
    networks:
      - ticketrush-network

  seat-service:
    image: ${ECR_REGISTRY}/ticketrush/seat-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: seat-service
    mem_limit: 640m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8086
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
    networks:
      - ticketrush-network

  ticket-service:
    image: ${ECR_REGISTRY}/ticketrush/ticket-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: ticket-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8087
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ticketrush-network

  gateway-service:
    image: ${ECR_REGISTRY}/ticketrush/gateway-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: gateway-service
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      performance-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      ticket-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

networks:
  ticketrush-network:
    name: ticketrush-network
    driver: bridge

volumes:
  mysql-data:
    name: ticketrush-mysql-data
  redis-data:
    name: ticketrush-redis-data
  kafka-data:
    name: ticketrush-kafka-data