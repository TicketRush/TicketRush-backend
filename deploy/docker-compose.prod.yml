name: ticketrush-prod

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    logging: *default-logging
    image: mysql:8.0
    container_name: ticketrush-mysql
    mem_limit: 768m
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/001-ticket-rush-schema.sql:/docker-entrypoint-initdb.d/001-ticket-rush-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ticketrush-network

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: ticketrush-redis
    # 실측 최대 4.1 MiB / 상한의 3.20%로 여유가 30배다(ADR 0006). 상향 근거가 없어 유지한다.
    mem_limit: 128m
    restart: unless-stopped
    # healthcheck가 `redis-cli -a <비밀번호>`를 쓰지 않아도 되게 한다. redis-cli가 이 값을 자동으로 읽으므로
    # healthcheck 프로세스 인자에는 비밀번호가 실리지 않고, `-a`가 매번 뱉는 경고도 없다.
    # (아래 --requirepass는 redis-server의 인자라 `ps`·`docker inspect`에 그대로 보인다. 그걸 없애려면
    #  redis.conf 마운트가 필요한데, 같은 호스트에서 그 파일을 읽을 수 있는 주체는 어차피 .env도 읽는다.)
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?deploy/.env에 REDIS_PASSWORD를 설정하세요}
    command:
      - redis-server
      # Redis는 포트를 publish 하지 않아 노출면이 같은 compose 네트워크로 한정되지만,
      # 컨테이너 하나만 뚫려도 락·토큰·캐시가 통째로 무방비가 된다(ADR 0008).
      - --requirepass
      - ${REDIS_PASSWORD:?deploy/.env에 REDIS_PASSWORD를 설정하세요}
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
      # mem_limit(128m)만 있으면 Redis는 자기 상한을 모른 채 커널에 OOMKill 당한다.
      # SPOF를 수용하기로 한 이상(ADR 0008) 가장 흔한 사망 원인을 방치할 수 없어 스스로 방어하게 한다.
      #
      # 64mb인 이유(= 상한의 50%): appendonly가 켜져 있어 AOF rewrite는 fork를 하고 최악의 CoW는
      # 데이터셋 전체 복사다. 상한에 가깝게 잡으면(예: 96mb) 정작 가득 찬 순간 데이터+CoW+출력 버퍼가
      # 128m을 넘겨, noeviction이 거절을 시작하기 전에 커널이 먼저 죽인다 — 막으려던 실패 모드가 그대로 남는다.
      - --maxmemory
      - 64mb
      # noeviction이어야 한다. allkeys-lru였다면 좌석 락 키가 evict돼 중복 HOLD 경로가 열린다.
      # 한도 초과 시 쓰기를 거절하는 편이 fail-closed 원칙과 일치한다.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      # 무인증 ping은 NOAUTH 에러를 "응답"으로 받는다. 종료코드에만 기대면 false-healthy가 될 수 있고,
      # 그러면 앱 4개가 붙지도 못할 Redis를 향해 기동한다. 응답 문자열을 직접 확인한다.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketrush-network

  # Redis 지표 수집 경로가 없어 장애를 사후에 500 로그로만 인지했다(ADR 0008).
  # SPOF를 수용하는 이상 죽었을 때 즉시 아는 것이 유일한 대응책이므로 redis_up을 Grafana 알림에 물린다.
  redis-exporter:
    logging: *default-logging
    image: oliver006/redis_exporter:v1.62.0-alpine
    container_name: ticketrush-redis-exporter
    mem_limit: 32m
    restart: unless-stopped
    # 관측 포트는 인터넷에 열지 않는다(ADR 0007). Prometheus가 같은 네트워크에서 서비스명으로 스크랩한다.
    #
    # 주소는 앱 4개와 같은 ${REDIS_HOST}/${REDIS_PORT}를 쓴다. 여기만 redis:6379로 고정하면
    # ElastiCache로 옮겼을 때(ADR 0008 재평가 트리거) 앱은 따라가지만 exporter는 사라진 컨테이너를
    # 계속 보며 redis_up=0을 내고, 알림이 실제 다운을 알리는 신호가 아니게 된다.
    environment:
      REDIS_ADDR: redis://${REDIS_HOST}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?deploy/.env에 REDIS_PASSWORD를 설정하세요}
    # service_healthy가 아니다. Redis가 죽어 있을 때 redis_up=0을 보고하는 것이 이 컨테이너의 존재
    # 이유인데, healthy를 조건으로 걸면 정작 감지해야 할 상황에서 exporter 자신이 뜨지 못한다.
    depends_on:
      redis:
        condition: service_started
    networks:
      - ticketrush-network

  # 단일 EC2에 앱 8개 + 인프라가 전부 올라가 CPU 경합이 1차 병목 후보인데, 호스트 자원 지표를
  # 수집하는 주체가 없었다(#465). 부하 테스트(#348)의 병목 판정 근거가 여기서 나온다.
  node-exporter:
    logging: *default-logging
    image: prom/node-exporter:v1.8.2
    container_name: ticketrush-node-exporter
    mem_limit: 32m
    restart: unless-stopped
    # 컨테이너 안에서 돌지만 재는 대상은 '호스트'다. /proc·/sys를 마운트하고
    # --path.rootfs로 가리켜야 컨테이너 네임스페이스가 아닌 EC2 실제 자원을 읽는다.
    # 이 마운트를 빠뜨리면 지표가 나오긴 하는데 전부 컨테이너 것이라 병목 판단에 못 쓴다.
    #
    # 적용 확인은 두 축을 함께 본다 — 메모리만 보면 네트워크 결함을 놓친다(#508).
    #   node_memory_MemTotal_bytes ≈ 7.6 GiB (ADR 0007 인스턴스 실측치)
    #   node_network_* 의 device 에 ens5 가 있고 eth0 가 없다
    pid: host
    # netns까지 호스트여야 하는 이유: /proc/net 은 일반 파일이 아니라 network namespace 에 묶인
    # 경로다. 커널이 /proc/net/dev 내용을 '읽는 프로세스의 netns' 기준으로 만들기 때문에, 위
    # /proc 마운트와 --path.procfs 로는 넘어오지 않는다. 브리지 컨테이너로 두면 호스트 ens5 가
    # 아니라 자기 veth(eth0)만 나온다 — #348 이 지목한 회선 축을 재는 수단이 통째로 막혔었다(#508).
    # CPU·메모리는 같은 마운트로 정상이라 이 결함은 조용했다. pid: host 는 PID namespace 라 별개다.
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # container-mem-sampler 가 쓴 .prom 을 읽는다(#515). 이름 있는 볼륨이라 호스트에 디렉토리를
      # 미리 만들어 둘 필요가 없다 — CD 는 deploy/ 를 풀고 compose up 만 하므로 mkdir 할 자리가 없다.
      - container-textfile:/host/textfile:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      # 컨테이너별 메모리를 여기로 받는다(#515). 스크랩 타깃이 늘지 않으므로 prometheus.aws.yml 도
      # cd.yml 의 EXPECTED_TARGETS 도 그대로다 — cAdvisor(별도 타깃 + 128 MiB)와 다른 점이다.
      - "--collector.textfile.directory=/host/textfile"
      # 관측 포트는 인터넷에 열지 않는다(ADR 0007). host netns 라 기본값 0.0.0.0 이면 공인 IP가
      # 붙은 ens5 에도 열려, 방어선이 수동 관리하는 보안그룹 규칙 하나가 된다 — ADR 0007 이 9090 에
      # 대해 기각한 바로 그 구조다. docker0 게이트웨이에만 묶으면 소켓이 ens5 에 아예 없다.
      # 127.0.0.1 은 쓸 수 없다. Prometheus 는 브리지 컨테이너라 호스트 루프백에 닿지 못한다.
      - "--web.listen-address=172.17.0.1:9100"
      # host netns 라 veth(컨테이너 수만큼)·compose 브리지가 전부 딸려 온다. 회선 판정에 쓰는 건
      # ens5 하나이고, 나머지는 컨테이너가 늘 때마다 불어나는 시리즈다.
      #
      # 두 벌인 이유: device 라벨을 붙이는 collector 가 둘이고 필터 플래그가 서로 다르다.
      # netdev  = 트래픽 카운터(node_network_*_bytes_total) — 회선 병목을 재는 축
      # netclass = 인터페이스 메타데이터(node_network_up·mtu·speed) — 한쪽만 걸면 veth 가 남는다
      - "--collector.netdev.device-exclude=^(veth.*|br-.*|docker0)$"
      - "--collector.netclass.ignored-devices=^(veth.*|br-.*|docker0)$"
    # network_mode: host 는 networks: 와 양립하지 않아 서비스명 DNS 가 없다. 스크랩은 prometheus 의
    # extra_hosts(host.docker.internal)로 간다 — monitoring/prometheus.aws.yml 의 node job.

  # 컨테이너별 메모리 시계열(#515). node_* 는 호스트 총량이라 "어느 컨테이너가 자기 mem_limit 에
  # 가까운지"를 답하지 못했고, #509 에서 seat-service 가 cgroup OOM 으로 죽을 때까지 신호가 없었다.
  #
  # cAdvisor 로 메우려다 되돌렸다(adf21a24) — 이 호스트(Docker 29.1.3 + cgroup v2 + systemd)에서
  # 컨테이너를 하나도 열거하지 못한다. cgroup 에는 docker-<id>.scope 가 멀쩡히 있으므로 그것을 직접
  # 읽어 node-exporter 의 textfile collector 로 넘긴다. 그래서 스크랩 타깃이 늘지 않는다.
  #
  # 예산: 32 MiB. cAdvisor 는 128 MiB 를 먹고도 데이터를 못 줬다(ADR 0006 재평가 반영).
  container-mem-sampler:
    logging: *default-logging
    image: alpine:3.21
    container_name: ticketrush-container-mem-sampler
    mem_limit: 32m
    restart: unless-stopped
    # 스크랩 간격(15s)과 맞춘다. 더 촘촘히 써도 node-exporter 가 읽는 시점이 15초라 새 표본이 없다.
    environment:
      INTERVAL: "15"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      # cgroup v2 의 컨테이너 scope. memory.current / max / peak / events 를 읽는다.
      - /sys/fs/cgroup:/host/cgroup:ro
      # 컨테이너 이름 매핑 전용. docker.sock 을 주지 않는 이유는 스크립트 주석 참고 —
      # 소켓은 :ro 로 걸어도 컨테이너 생성·exec 이 가능해 사실상 호스트 root 다(ADR 0007 최소 노출).
      - /var/lib/docker/containers:/host/docker-containers:ro
      - ./observability/container-mem-sampler.sh:/opt/container-mem-sampler.sh:ro
      - container-textfile:/textfile
    # 실행 비트에 기대지 않는다. CD 는 deploy/ 를 tar 로 말아 푸는데, 모드가 어긋나면 컨테이너가
    # 조용히 재시작 루프에 빠진다.
    command: ["sh", "/opt/container-mem-sampler.sh"]
    # 앱과 같은 네트워크에 둘 이유가 없다. 이 컨테이너는 아무 포트도 듣지 않고 아무 데도 접속하지
    # 않는다 — 파일에 쓸 뿐이다(ADR 0007 노출 표에 행이 늘지 않는다).
    network_mode: none

  kafka-volume-init:
    logging: *default-logging
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka-volume-init
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        chown -R 1000:1000 /tmp/kraft-combined-logs &&
        chmod -R u+rwX,g+rwX /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    logging: *default-logging
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - ticketrush-network

  user-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/user-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: user-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  auth-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/auth-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: auth-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - ticketrush-network

  performance-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/performance-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: performance-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  booking-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/booking-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: booking-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

  payment-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/payment-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: payment-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
    networks:
      - ticketrush-network

  seat-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/seat-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: seat-service
    mem_limit: 640m
    restart: unless-stopped
    env_file:
      - .env
    # JVM 옵션은 .env 가 아니라 여기 둔다(#509). environment 가 env_file 보다 우선하므로 EC2 의
    # .env 에 같은 키가 있어도 이 값이 이긴다. .env 는 저장소에 없어 리뷰도 diff 도 남지 않고,
    # 파일을 다시 만들면 조용히 사라진다 — 힙 상한이 그렇게 관리될 값이 아니다.
    #
    # 비힙 상한을 명시하는 이유: 기본값이 사실상 열려 있어 -Xmx 로 힙을 묶어도 cgroup 한계를
    # 넘길 수 있다(#509 는 RSS 626 MiB 로 640 MiB 상한에 걸려 커널에 죽었다).
    #   MaxDirectMemorySize 기본값 = -Xmx = 384 MiB. 힙과 같은 크기가 힙 밖에 또 열려 있었다.
    #     실측 최대 1.5 MiB(gateway)라 64m 은 40배 여유다.
    #   ReservedCodeCacheSize 기본 240 MiB 예약. 실측 최대 33.3 MiB(booking)라 64m 은 2배 여유다.
    #
    # ⚠ MaxMetaspaceSize 는 두지 않는다. 처음에 128m 을 줬다가 배포가 실패했다.
    #   OutOfMemoryError: Metaspace 로 앱이 좀비가 됐고 — 프로세스는 살아 있는데 요청을 처리하지
    #   못한다 — Prometheus 스크랩이 타임아웃나 CD 의 up 게이트에서 걸렸다. 이유가 둘이다.
    #     1) "무제한이라 계속 자란다"는 전제가 틀렸다. 상한 없는 7개 서비스 실측이 106-140 MiB 에서
    #        수렴한다(performance 139.7 / booking 136.1 / user 106.1). 클래스 로딩은 유한하다.
    #     2) 실패 모드가 나쁘다. 힙 OOM 과 달리 프로세스가 죽지 않아 재시작도 안 되고, 헬스체크가
    #        아니라 스크랩 타임아웃으로만 드러난다. 조기 경보가 아니라 조용한 마비다.
    #   예산 관점에서도 무의미하다 — 실측(140)을 덮을 값이면 힙 384 와 합쳐 이미 640 을 넘는다.
    #
    # 여기 없는 스레드 스택은 위 tomcat max-threads(50)로 따로 묶었다.
    environment:
      SERVER_PORT: 8086
      JAVA_TOOL_OPTIONS: >-
        -Xms128m
        -Xmx384m
        -XX:ReservedCodeCacheSize=64m
        -XX:MaxDirectMemorySize=64m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
    networks:
      - ticketrush-network

  ticket-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/ticket-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: ticket-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8087
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ticketrush-network

  gateway-service:
    logging: *default-logging
    image: ${ECR_REGISTRY}/ticketrush/gateway-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: gateway-service
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      # actuator(8090)는 인터넷에 열지 않는다. CD가 EC2 호스트에서 헬스체크를 하려면
      # 루프백에는 붙어 있어야 한다. 나머지 7개 서비스는 publish 하지 않는다(컨테이너 네트워크 전용).
      - "127.0.0.1:8090:8090"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    depends_on:
      # 대기열(#472)이 게이트웨이에서 Redis를 직접 쓴다. 없이 뜨면 오픈 시각 첫 폴링이 전부 503이다.
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      performance-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      ticket-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

  prometheus:
    logging: *default-logging
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    mem_limit: 384m
    restart: unless-stopped
    # command는 이미지 기본 CMD를 통째로 덮으므로 기본 플래그를 재명시해야 한다.
    # 마지막 줄만 실질 변경: 로컬 k6의 remote-write(-o experimental-prometheus-rw) 수신용 receiver 활성화.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      # TSDB는 MySQL·Kafka와 같은 루트 EBS 위에 있다. 상한이 없으면 부하 테스트를 반복할수록
      # 디스크가 차고, 차는 순간 관측 스택이 아니라 서비스 전체가 죽는다.
      - "--storage.tsdb.retention.size=4GB"
      - "--storage.tsdb.retention.time=15d"
    # 인터넷에 노출하지 않는다. remote-write receiver에는 인증이 없다.
    # k6의 remote-write는 개발 PC에서 나가는 push이므로 SSH 터널로 충분하다(ADR 0007).
    #   ssh -L 9090:localhost:9090 <user>@<EIP>
    ports:
      - "127.0.0.1:9090:9090"
    # node-exporter 는 host netns 라(#508) compose 네트워크의 DNS 에 이름이 없다. docker0
    # 게이트웨이로 나가 거기 리스닝 중인 exporter 를 긁는다. 주소는 도커가 컨테이너별로 채워 넣는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 배포본은 앱이 같은 네트워크의 컨테이너이므로 서비스명 기반 scrape 설정을 쓴다.
      - ./monitoring/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ticketrush-network

  grafana:
    logging: *default-logging
    # 11.1.0은 CVE-2024-9264(인증 후 명령 주입) 영향 범위다. 11.1.7이 그 라인의 수정 버전이다.
    image: grafana/grafana:11.1.7
    container_name: grafana
    mem_limit: 256m
    restart: unless-stopped
    # 인터넷에 노출하지 않는다. SSH 터널(-L 3000:localhost:3000)로 접근한다(ADR 0007).
    ports:
      - "127.0.0.1:3000:3000"
    # 앱 환경변수(DB·Kafka 등)는 필요 없으므로 env_file을 붙이지 않는다.
    # 아래 ${...}는 compose가 --env-file deploy/.env 에서 보간한다.
    # `:?`가 없으면 EC2의 .env에 키가 빠졌을 때 빈 문자열로 보간되고, Grafana가 빈 override를
    # 무시하고 기본값(admin/admin)으로 뜨는데도 CD는 초록불로 끝난다. 그래서 없으면 배포를 멈춘다.
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?deploy/.env에 GRAFANA_ADMIN_USER를 설정하세요}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?deploy/.env에 GRAFANA_ADMIN_PASSWORD를 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Redis 다운 알림의 Slack contact point가 프로비저닝 파일에서 $SLACK_WEBHOOK_URL로 참조한다(ADR 0008).
      # booking-service DLT 알림과 같은 webhook을 재사용한다.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?deploy/.env에 SLACK_WEBHOOK_URL을 설정하세요}
    # 로컬(docker-compose.yml)은 provisioning 디렉토리를 통째로 마운트하지만, 배포본은 하위 디렉토리별로
    # 나눠 마운트한다. 알림만 배포본 전용 소스(provisioning-aws)에서 가져와야 하기 때문이다.
    #
    # 알림을 provisioning/ 공용 디렉토리에 두면 로컬 compose가 그것까지 마운트하는데, 로컬 스택에는
    # redis-exporter가 없어 redis_up 자체가 없다 → noDataState=Alerting → 모든 개발자 로컬에서
    # "Redis 다운"이 영구 발화한다. prometheus.yml / prometheus.aws.yml 로 로컬·배포본을 나누는
    # 기존 관행과 같은 이유다.
    #
    # 부모(/etc/grafana/provisioning)를 :ro로 통째 마운트한 뒤 그 안에 alerting을 겹쳐 마운트하는 방식은
    # 쓸 수 없다 — 읽기 전용이라 마운트포인트를 만들지 못해 컨테이너가 기동에 실패한다.
    # 하위별 마운트는 이미지에 이미 있는 디렉토리를 그대로 쓰므로 그 문제가 없다.
    volumes:
      # datasource url이 http://prometheus:9090(서비스명)이라 로컬과 같은 파일을 그대로 쓴다.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning-aws/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - ticketrush-network

networks:
  ticketrush-network:
    name: ticketrush-network
    driver: bridge

volumes:
  mysql-data:
    name: ticketrush-mysql-data
  redis-data:
    name: ticketrush-redis-data
  kafka-data:
    name: ticketrush-kafka-data
  prometheus-data:
    name: ticketrush-prometheus-data
  grafana-data:
    name: ticketrush-grafana-data
  # container-mem-sampler(rw) → node-exporter(ro) 로 .prom 을 건네는 통로(#515). 호스트 경로 대신
  # 이름 있는 볼륨인 것은 CD 에 mkdir 할 자리가 없어서다 — deploy/ 를 풀고 compose up 만 한다.
  container-textfile:
    name: ticketrush-container-textfile