name: ticketrush-prod

services:
  mysql:
    image: mysql:8.0
    container_name: ticketrush-mysql
    mem_limit: 768m
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init/001-ticket-rush-schema.sql:/docker-entrypoint-initdb.d/001-ticket-rush-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ticketrush-network

  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    mem_limit: 128m
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketrush-network

  kafka-volume-init:
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka-volume-init
    user: "0:0"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        chown -R 1000:1000 /tmp/kraft-combined-logs &&
        chmod -R u+rwX,g+rwX /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    container_name: ticketrush-kafka
    mem_limit: 1024m
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://:29092,
        CONTROLLER://:29093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - ticketrush-network

  user-service:
    image: ${ECR_REGISTRY}/ticketrush/user-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: user-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  auth-service:
    image: ${ECR_REGISTRY}/ticketrush/auth-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: auth-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - ticketrush-network

  performance-service:
    image: ${ECR_REGISTRY}/ticketrush/performance-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: performance-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ticketrush-network

  booking-service:
    image: ${ECR_REGISTRY}/ticketrush/booking-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: booking-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

  payment-service:
    image: ${ECR_REGISTRY}/ticketrush/payment-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: payment-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
    networks:
      - ticketrush-network

  seat-service:
    image: ${ECR_REGISTRY}/ticketrush/seat-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: seat-service
    mem_limit: 640m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8086
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      performance-service:
        condition: service_started
    networks:
      - ticketrush-network

  ticket-service:
    image: ${ECR_REGISTRY}/ticketrush/ticket-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: ticket-service
    mem_limit: 576m
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8087
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ticketrush-network

  gateway-service:
    image: ${ECR_REGISTRY}/ticketrush/gateway-service:${IMAGE_TAG}
    platform: linux/amd64
    container_name: gateway-service
    mem_limit: 512m
    restart: unless-stopped
    ports:
      - "8080:8080"
      # actuator(9091)는 인터넷에 열지 않는다. CD가 EC2 호스트에서 헬스체크를 하려면
      # 루프백에는 붙어 있어야 한다. 나머지 7개 서비스는 publish 하지 않는다(컨테이너 네트워크 전용).
      - "127.0.0.1:9091:9091"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      performance-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
      ticket-service:
        condition: service_started
      seat-service:
        condition: service_started
    networks:
      - ticketrush-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    mem_limit: 384m
    restart: unless-stopped
    # command는 이미지 기본 CMD를 통째로 덮으므로 기본 플래그를 재명시해야 한다.
    # 마지막 줄만 실질 변경: 로컬 k6의 remote-write(-o experimental-prometheus-rw) 수신용 receiver 활성화.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
      # TSDB는 MySQL·Kafka와 같은 루트 EBS 위에 있다. 상한이 없으면 부하 테스트를 반복할수록
      # 디스크가 차고, 차는 순간 관측 스택이 아니라 서비스 전체가 죽는다.
      - "--storage.tsdb.retention.size=4GB"
      - "--storage.tsdb.retention.time=15d"
    # 인터넷에 노출하지 않는다. remote-write receiver에는 인증이 없다.
    # k6의 remote-write는 개발 PC에서 나가는 push이므로 SSH 터널로 충분하다(ADR 0007).
    #   ssh -L 9090:localhost:9090 <user>@<EIP>
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # 배포본은 앱이 같은 네트워크의 컨테이너이므로 서비스명 기반 scrape 설정을 쓴다.
      - ./monitoring/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ticketrush-network

  grafana:
    # 11.1.0은 CVE-2024-9264(인증 후 명령 주입) 영향 범위다. 11.1.7이 그 라인의 수정 버전이다.
    image: grafana/grafana:11.1.7
    container_name: grafana
    mem_limit: 256m
    restart: unless-stopped
    # 인터넷에 노출하지 않는다. SSH 터널(-L 3000:localhost:3000)로 접근한다(ADR 0007).
    ports:
      - "127.0.0.1:3000:3000"
    # 앱 환경변수(DB·Kafka 등)는 필요 없으므로 env_file을 붙이지 않는다.
    # 아래 ${...}는 compose가 --env-file deploy/.env 에서 보간한다.
    # `:?`가 없으면 EC2의 .env에 키가 빠졌을 때 빈 문자열로 보간되고, Grafana가 빈 override를
    # 무시하고 기본값(admin/admin)으로 뜨는데도 CD는 초록불로 끝난다. 그래서 없으면 배포를 멈춘다.
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?deploy/.env에 GRAFANA_ADMIN_USER를 설정하세요}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?deploy/.env에 GRAFANA_ADMIN_PASSWORD를 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # datasource url이 http://prometheus:9090(서비스명)이라 로컬과 같은 파일을 그대로 쓴다.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - ticketrush-network

networks:
  ticketrush-network:
    name: ticketrush-network
    driver: bridge

volumes:
  mysql-data:
    name: ticketrush-mysql-data
  redis-data:
    name: ticketrush-redis-data
  kafka-data:
    name: ticketrush-kafka-data
  prometheus-data:
    name: ticketrush-prometheus-data
  grafana-data:
    name: ticketrush-grafana-data