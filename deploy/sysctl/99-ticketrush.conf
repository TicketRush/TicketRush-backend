# TicketRush 배포 호스트 커널 파라미터
#   적용: sudo cp deploy/sysctl/99-ticketrush.conf /etc/sysctl.d/99-ticketrush.conf
#         sudo sysctl --system
#   ⚠ CD 가 이 파일을 배포하지 않는다(cd.yml 에 sysctl 단계가 없다). nginx 설정과 마찬가지로
#     저장소는 기록본이고 적용은 수동이다 — 인스턴스를 새로 만들면 다시 넣어야 한다.
#
# ── 왜 필요한가 (#555 계단 회차, 2026-08-14 실측) ────────────────────────────
# admit-rate 무릎을 재는 네 회차 모두에서 유입의 17~20% 가 대기열 진입에 실패했다.
# k6 의 실패 status 태그가 전부 0 이었다 — HTTP 응답을 못 받은 것, 즉 서버 응답이 아니라
# 전송 계층 실패다. k6 로그의 실제 오류는
#   dial tcp <IP>:443: connect: connection refused   1,650건
#   EOF                                                485건
#   dial: i/o timeout                                  188건
# 대상 커널 카운터가 원인을 확정했다:
#   TcpExtListenOverflows        0        ← accept 큐는 넘치지 않았다
#   TcpExtListenDrops            0
#   TcpExtTCPReqQFullDoCookies   15,826   ← SYN 큐가 넘쳐 SYN 쿠키로 폴백했다
# 즉 벽은 애플리케이션도 생성기도 아닌 TCP SYN 큐였다. 부하 도구만의 문제가 아니라
# 실제 티켓 오픈에서도 같은 벽에 닿는다.
#
# ⚠ nginx 의 listen backlog 와 짝이다. 한쪽만 올리면 다른 쪽에서 잘린다 —
#   deploy/nginx/api.ticketrush.store.conf 의 `listen 443 ssl backlog=4096` 을 함께 본다.

# SYN 큐(half-open) 크기. 기본 512 에서 올린다. 이것이 이번에 넘친 큐다.
net.ipv4.tcp_max_syn_backlog = 8192

# accept 큐 상한. nginx 의 backlog=4096 이 이 값을 넘지 못하므로 여유를 둔다.
# (실측에서 넘치지는 않았지만 SYN 큐를 열면 다음 병목이 여기로 옮겨 온다)
net.core.somaxconn = 8192

# NIC 수신 큐. 기본 1000 은 2 vCPU 에 수천 커넥션이 몰릴 때 얕다.
net.core.netdev_max_backlog = 8192

# ⚠ tcp_syncookies 는 건드리지 않는다(기본 1 유지). 큐가 넉넉해지면 폴백이 안 일어나고,
#   그래도 넘치면 연결을 거절하는 대신 쿠키로 받아 주는 편이 낫다. 위 카운터
#   TCPReqQFullDoCookies 가 그 폴백 횟수라 앞으로도 감시 지표로 쓴다(런북 G1b).
