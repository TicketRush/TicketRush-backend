spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # local은 무인증 Redis라 prod 프로파일에만 둔다(ADR 0008).
      password: ${REDIS_PASSWORD}

service:
  performance:
    # 운영은 performance-service URL을 반드시 주입(base의 localhost 기본값 오버라이드, 미주입 시 fail-fast).
    # 기본값을 남겨두면 컨테이너가 자기 자신을 호출해 예매 조회의 공연 필드가 전부 null이 되는데, 기동은 성공해 조용히 깨진다.
    url: ${PERFORMANCE_SERVICE_URL}
  user:
    # 운영은 user-service URL을 반드시 주입(base의 localhost 기본값 오버라이드, 미주입 시 fail-fast).
    # 기본값을 남겨두면 컨테이너가 자기 자신을 호출해 관리자 목록의 예매자 필드가 전부 null이 되는데, 기동은 성공해 조용히 깨진다.
    url: ${USER_SERVICE_URL}
  ticket:
    # 운영은 ticket-service URL을 반드시 주입(base의 localhost 기본값 오버라이드, 미주입 시 fail-fast).
    # 기본값을 남겨두면 컨테이너가 자기 자신을 호출해 취소·재환불이 전부 503이 되는데, 기동은 성공해 조용히 깨진다.
    url: ${TICKET_SERVICE_URL}

gateway:
  # 운영은 게이트웨이 내부 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

custom:
  security:
    # 운영은 내부 API 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
    internal-token: ${INTERNAL_API_TOKEN}
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

# actuator를 앱 포트에서 분리한다. gateway의 8080은 인터넷에 열려 있고 SecurityConfig가
# permitAll이라, 분리하지 않으면 /actuator/prometheus 가 인증 없이 공개된다(ADR 0007).
# 8090은 compose에서 publish 하지 않으므로 같은 네트워크의 Prometheus만 접근할 수 있다.
# prod 에만 둔다. application.yml 에 두면 로컬에서 앱 8개가 8090을 다퉈 기동이 실패한다.
management:
  server:
    port: 8090
