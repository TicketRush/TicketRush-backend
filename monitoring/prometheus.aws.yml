global:
  scrape_interval: 15s

# AWS 배포본(docker-compose.aws.yml) 전용. 앱 8개가 같은 compose 네트워크의 컨테이너로 뜨므로
# host.docker.internal 대신 서비스명으로 스크랩한다. 로컬 개발용은 prometheus.yml을 쓴다.
# 스택별 대시보드 분리(#45)를 위해 gateway(WebFlux/리액티브)와 나머지(MVC)를 별도 job으로 나눈다.
# 대시보드 JSON은 datasource uid 'prometheus'를 참조하므로 이 파일 교체만으로 그대로 동작한다.
scrape_configs:
  - job_name: 'gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'gateway-service:8080'  # gateway-service (WebFlux)
        labels:
          stack: reactive

  - job_name: 'ticketrush-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'user-service:8081'
          - 'auth-service:8082'
          - 'performance-service:8083'
          - 'booking-service:8084'
          - 'payment-service:8085'
          - 'seat-service:8086'
          - 'ticket-service:8087'
        labels:
          stack: mvc
