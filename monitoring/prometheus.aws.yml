global:
  scrape_interval: 15s

# AWS 배포본(deploy/docker-compose.prod.yml) 전용. 앱 8개가 같은 compose 네트워크의 컨테이너로 뜨므로
# host.docker.internal 대신 서비스명으로 스크랩한다. 로컬 개발용은 prometheus.yml을 쓴다.
#
# 포트가 8090인 이유: prod 프로파일은 actuator를 앱 포트에서 분리한다(management.server.port).
# gateway의 8080은 인터넷에 열려 있어, 분리하지 않으면 /actuator/prometheus 가 무인증 공개된다(ADR 0007).
# 8090은 compose에서 publish 하지 않으므로 이 네트워크 안에서만 닿는다.
#
# 스택별 대시보드 분리(#45)를 위해 gateway(WebFlux/리액티브)와 나머지(MVC)를 별도 job으로 나눈다.
# 대시보드 JSON은 datasource uid 'prometheus'를 참조하므로 이 파일 교체만으로 그대로 동작한다.
scrape_configs:
  - job_name: 'gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'gateway-service:8090'  # gateway-service (WebFlux), 앱 포트는 8080
        labels:
          stack: reactive

  - job_name: 'ticketrush-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'user-service:8090'         # 앱 포트 8081
          - 'auth-service:8090'         # 앱 포트 8082
          - 'performance-service:8090'  # 앱 포트 8083
          - 'booking-service:8090'      # 앱 포트 8084
          - 'payment-service:8090'      # 앱 포트 8085
          - 'seat-service:8090'         # 앱 포트 8086
          - 'ticket-service:8090'       # 앱 포트 8087
        labels:
          stack: mvc

  # Redis SPOF를 수용한 이상 죽었을 때 즉시 아는 것이 유일한 대응책이다(ADR 0008).
  # redis_up 이 0이면 Grafana Alerting → Slack으로 나간다. exporter는 포트를 publish 하지 않는다.
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
        labels:
          stack: observability

  # EC2 호스트 자원(CPU·메모리·디스크·네트워크) 지표(#465). 부하 테스트(#348)에서 "호스트가 포화라
  # 느린지, 앱이 느린지"를 가르는 판정 근거다.
  #
  # 서비스명이 아니라 host.docker.internal 인 이유: node-exporter 는 netdev 를 호스트 것으로 읽으려고
  # network_mode: host 로 뜬다(#508). 그래서 compose 네트워크의 DNS 에 이름이 없다. exporter 는
  # docker0 게이트웨이에만 리스닝하므로 여전히 인터넷에서는 닿지 않는다(ADR 0007).
  - job_name: 'node'
    static_configs:
      - targets:
          - 'host.docker.internal:9100'
        labels:
          stack: observability

  # 자기 자신. ADR 0007이 "전환 시점"의 기준으로 삼은 '부하 중 Prometheus의 CPU·메모리 점유'를
  # 재려면 prometheus_* 자기 지표가 필요하다. mem_limit(384m) 재평가 근거도 여기서 나온다.
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          stack: observability
