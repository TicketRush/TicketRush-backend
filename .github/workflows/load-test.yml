name: Load Test (k6)

# 부하 생성기(k6)를 GitHub Actions 러너에서 실행하고, 대상 앱/Prometheus는 원격(Oracle)에 둔다.
# 부하 생성기-대상 분리로 신뢰 가능한 정량 수치를 확보한다(#360, #342 후속).
# 대상 주소는 secrets로 주입한다:
#   LOADTEST_BASE_URL            예) http://<oracle-public-ip>:8080   (게이트웨이)
#   LOADTEST_PROMETHEUS_RW_URL   예) http://<oracle-public-ip>:9090/api/v1/write

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 실행할 시나리오
        type: choice
        default: seat-layouts
        options:
          - seat-layouts
          - booking-create
      vus:
        description: 가상 사용자 수 (VUS)
        type: string
        default: "50"
      ramp:
        description: 램프업/다운 시간 (예 30s)
        type: string
        default: "30s"
      steady:
        description: 정상 부하 유지 시간 (예 1m)
        type: string
        default: "1m"
      perf_id:
        description: 대상 공연 ID (시딩한 값)
        type: string
        default: "1"
      user_id:
        description: "[booking-create] DevToken 발급 대상 사용자 ID"
        type: string
        default: "1"
      seat_id_min:
        description: "[booking-create] 예매 시도 seat_id 하한"
        type: string
        default: "1"
      seat_id_max:
        description: "[booking-create] 예매 시도 seat_id 상한"
        type: string
        default: "100"

# 부하 측정 중 겹치기/취소를 막는다(측정 신뢰성).
concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: k6 설치
        uses: grafana/setup-k6-action@v1

      - name: k6 부하 실행
        # env.js가 __ENV(= OS 환경변수)에서 값을 읽으므로 env 주입만으로 기존 시나리오를 그대로 쓴다.
        env:
          BASE_URL: ${{ secrets.LOADTEST_BASE_URL }}
          K6_OUT: experimental-prometheus-rw
          K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.LOADTEST_PROMETHEUS_RW_URL }}
          K6_PROMETHEUS_RW_TREND_STATS: "p(95),p(99),avg"
          PERF_ID: ${{ inputs.perf_id }}
          USER_ID: ${{ inputs.user_id }}
          SEAT_ID_MIN: ${{ inputs.seat_id_min }}
          SEAT_ID_MAX: ${{ inputs.seat_id_max }}
          VUS: ${{ inputs.vus }}
          RAMP: ${{ inputs.ramp }}
          STEADY: ${{ inputs.steady }}
        run: |
          k6 run --summary-export=summary.json \
            "load-test/scenarios/${{ inputs.scenario }}.js"

      - name: 요약 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ inputs.scenario }}
          path: summary.json
          if-no-files-found: warn
