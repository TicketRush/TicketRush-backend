custom:
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL}
    description: "Production Server"

  cors:
    enabled: true
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN}

services:
  user:
    host: ${USER_SERVICE_HOST}
  auth:
    host: ${AUTH_SERVICE_HOST}
  performance:
    host: ${PERFORMANCE_SERVICE_HOST}
  booking:
    host: ${BOOKING_SERVICE_HOST}
  payment:
    host: ${PAYMENT_SERVICE_HOST}
  seat:
    host: ${SEAT_SERVICE_HOST}
  ticket:
    host: ${TICKET_SERVICE_HOST}

gateway:
  # 운영은 게이트웨이 내부 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

# actuator를 앱 포트에서 분리한다. gateway의 8080은 인터넷에 열려 있고 SecurityConfig가
# permitAll이라, 분리하지 않으면 /actuator/prometheus 가 인증 없이 공개된다(ADR 0007).
# 9091은 compose에서 publish 하지 않으므로 같은 네트워크의 Prometheus만 접근할 수 있다.
# prod 에만 둔다. application.yml 에 두면 로컬에서 앱 8개가 9091을 다퉈 기동이 실패한다.
management:
  server:
    port: 9091
