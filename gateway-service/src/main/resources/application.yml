server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://${services.user.host}:8081
              predicates:
                - Path=/api/v1/user/**,/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user,/v3/api-docs

            - id: auth-service
              uri: http://${services.auth.host}:8082
              predicates:
                - Path=/api/v1/auth/**,/api/v1/dev/auth/**,/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth,/v3/api-docs

            - id: performance-service
              uri: http://${services.performance.host}:8083
              predicates:
                - Path=/api/v1/performance/**,/v3/api-docs/performance
              filters:
                - RewritePath=/v3/api-docs/performance,/v3/api-docs

            - id: booking-service
              uri: http://${services.booking.host}:8084
              predicates:
                - Path=/api/v1/booking/**,/v3/api-docs/booking
              filters:
                - RewritePath=/v3/api-docs/booking,/v3/api-docs

            - id: payment-service
              uri: http://${services.payment.host}:8085
              predicates:
                - Path=/api/v1/payment/**,/v3/api-docs/payment
              filters:
                - RewritePath=/v3/api-docs/payment,/v3/api-docs

            - id: seat-sse-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/*/seat-status/stream
              metadata:
                response-timeout: -1
                connect-timeout: 5000

            - id: seat-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/**,/v3/api-docs/seat
              filters:
                - RewritePath=/v3/api-docs/seat,/v3/api-docs

            - id: ticket-service
              uri: http://${services.ticket.host}:8087
              predicates:
                # /api/v1/entries/** = 입장 검표(verify·check-in). ticket-service SecurityConfig가
                # hasRole("ADMIN")을 걸고 GatewayHeaderFilter가 게이트웨이 주입 헤더로 인증하는 설계인데
                # 라우트가 없어 외부에서 도달 자체가 불가능했다(인터넷에 열린 포트는 게이트웨이 8080뿐).
                - Path=/api/v1/ticket/**,/api/v1/entries/**,/v3/api-docs/ticket
              filters:
                - RewritePath=/v3/api-docs/ticket,/v3/api-docs

# 각 서비스의 API docs를 Gateway에서 통합
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user
      - name: auth-service
        url: /v3/api-docs/auth
      - name: performance-service
        url: /v3/api-docs/performance
      - name: booking-service
        url: /v3/api-docs/booking
      - name: payment-service
        url: /v3/api-docs/payment
      - name: seat-service
        url: /v3/api-docs/seat
      - name: ticket-service
        url: /v3/api-docs/ticket

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간(ms)
  refresh-token-expiration: 1209600000  # 14일(ms)

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

custom:
  security:
    permit-all: false
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). MVC 7개와 같은 경계를 쓴다.
  # 게이트웨이는 uri 라벨이 라우트 패턴으로 정규화되지 않고 `/**`·`UNKNOWN` 으로 뭉개진다
  # (#402 배포본 실측: uri 카디널리티 4). 그래서 켜도 버킷이 경로 수만큼 곱해지지 않는 대신,
  # 여기서 얻는 p95는 엔드포인트별이 아니라 인스턴스 전체를 합친 값이다 — 엔드포인트별 서버
  # 퍼센타일은 MVC 쪽(job=ticketrush-services)에서 본다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
