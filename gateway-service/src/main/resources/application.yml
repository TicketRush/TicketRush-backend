server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 요청을 60초 물린다. fail-closed는
      # '거절'이지 '무한 대기'가 아니다(ADR 0008). 게이트웨이는 전 서비스의 관문이라 여기서 물리면
      # 예매·좌석·티켓이 함께 멈춘다 — seat/performance-service가 같은 이유로 먼저 적용한 값이다.
      timeout: 1s
      connect-timeout: 1s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://${services.user.host}:8081
              predicates:
                - Path=/api/v1/user/**,/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user,/v3/api-docs

            - id: auth-service
              uri: http://${services.auth.host}:8082
              predicates:
                - Path=/api/v1/auth/**,/api/v1/dev/auth/**,/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth,/v3/api-docs

            - id: performance-service
              uri: http://${services.performance.host}:8083
              predicates:
                # /api/v1/banner/** = 메인 배너 조회(#564). 배너는 공연의 하위 리소스가 아니라 전용 리소스라
                # 경로가 /api/v1/performance 아래가 아니다. 다만 배포 단위는 performance-service이므로
                # 라우트를 여기 얹는다. 이 항목이 없으면 애플리케이션이 정상이어도 외부에서는 404다.
                - Path=/api/v1/performance/**,/api/v1/banner/**,/v3/api-docs/performance
              filters:
                - RewritePath=/v3/api-docs/performance,/v3/api-docs

            - id: booking-service
              uri: http://${services.booking.host}:8084
              predicates:
                - Path=/api/v1/booking/**,/v3/api-docs/booking
              filters:
                - RewritePath=/v3/api-docs/booking,/v3/api-docs

            - id: payment-service
              uri: http://${services.payment.host}:8085
              predicates:
                - Path=/api/v1/payment/**,/v3/api-docs/payment
              filters:
                - RewritePath=/v3/api-docs/payment,/v3/api-docs

            - id: seat-sse-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/*/seat-status/stream
              metadata:
                response-timeout: -1
                connect-timeout: 5000

            - id: seat-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/**,/v3/api-docs/seat
              filters:
                - RewritePath=/v3/api-docs/seat,/v3/api-docs

            - id: ticket-service
              uri: http://${services.ticket.host}:8087
              predicates:
                # /api/v1/entries/** = 입장 검표(verify·check-in). ticket-service SecurityConfig가
                # hasRole("ADMIN")을 걸고 GatewayHeaderFilter가 게이트웨이 주입 헤더로 인증하는 설계인데
                # 라우트가 없어 외부에서 도달 자체가 불가능했다(인터넷에 열린 포트는 게이트웨이 8080뿐).
                - Path=/api/v1/ticket/**,/api/v1/entries/**,/v3/api-docs/ticket
              filters:
                - RewritePath=/v3/api-docs/ticket,/v3/api-docs

# 각 서비스의 API docs를 Gateway에서 통합
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user
      - name: auth-service
        url: /v3/api-docs/auth
      - name: performance-service
        url: /v3/api-docs/performance
      - name: booking-service
        url: /v3/api-docs/booking
      - name: payment-service
        url: /v3/api-docs/payment
      - name: seat-service
        url: /v3/api-docs/seat
      - name: ticket-service
        url: /v3/api-docs/ticket

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간(ms)
  refresh-token-expiration: 1209600000  # 14일(ms)

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

# 대기열 (#472 / ADR 0009 — 1만 VU 유입 제어)
queue:
  # 켜는 순간 POST /api/v1/booking 이 입장 토큰 없는 기존 클라이언트에 전부 403이 된다. 프런트 연동
  # 전까지는 꺼 둔다. prod 롤백도 이 값 하나로 끝난다(재배포·DDL 없음).
  enabled: ${QUEUE_ENABLED:false}

  # 초당 입장 허용량. 예매 경로 부하를 유입 규모와 무관하게 이 값으로 고정하는 것이 대기열의 목적이다.
  #
  # 12 는 #555 계단 실측(2026-08-14)에서 **통과가 확인된 가장 높은 계단**이다. 무릎은 12 와 16
  # 사이이고, 그 계단에서 좌석맵 성공률 99.49% · 폴링 p95 2.03s · 호스트 CPU max 61.89% 로
  # 여유가 있었다. 계단 판정은 사전에 확정한 기준("직전 계단 대비 admit 증가분의 50% 미만만
  # 오르면 포화")으로 했다 — 12 → 16 에서 admit +4 에 예매 서버 RPS 는 +1.62(40.5%)였다.
  # 백로그 설정이 다른 두 시리즈에서 독립적으로 같은 구간을 가리켰다(시리즈 A 는 18.8%).
  #
  # ⚠️ 예매 성공만 세면 admit 20 이 1만 명을 더 빨리 소화한다. 그 수치에는 좌석맵을 못 본 사람이
  #   완주자로 섞여 있다 — 부하 여정이 좌석맵 실패에도 예매를 진행하기 때문이다. 완주를 좌석맵
  #   통과까지로 정의해 다시 세면 admit 16 은 두 회차 모두 12 보다 느리고(32분 24초 · 28분 53초
  #   vs 21분 32초 · 24분 38초), 20 은 회차에 따라 18분 59초 ~ 48분 46초로 편차가 2.57배다
  #   (12 는 1.14배). 티켓 오픈은 재시도가 없어 기대값이 아니라 최악값으로 잡는다.
  #
  # ⚠️ 이전 주석은 "#344 실측(booking 단독 258 RPS)의 한참 아래로 잡는다" 였는데 그 258 RPS 는
  #   예매 처리량이 아니다 — 98.61%(94,359건)가 좌석 점유 반려 409 였고 실제 예매 생성은
  #   1,324건 / 6분 36초 = 약 3.3 RPS 다. 20 이라는 값은 그 오독 위에 있었고 올려본 회차도 없었다.
  #
  # ⚠️ 무릎을 만드는 것은 admit 자체가 아니라 **admit 에 비례해 커지는 좌석 SSE 팬아웃**이다.
  #   구독자가 고정 100명이면 팬아웃 sends/s = 100 x admit 이다. 같은 admit 16 에서 구독자만
  #   0 으로 두자 좌석맵이 63.06% → 100.00%, 호스트 CPU 가 avg 64.61% → 33.65% 로 돌아왔다.
  #   따라서 이 값을 낮추는 것은 증상 완화이고 근본은 seat-service 의 팬아웃 비용이다.
  #
  # ⚠️ 이 값은 고정 상수라 최악 계단에 맞춰 잡혀 있고 평시에는 그만큼 손해를 본다. 하류 신호
  #   (좌석맵 p95 · seat-service CPU · Hikari pending)를 읽는 적응형 유입 제어가 그 손해를
  #   없애는 경로이고, 팬아웃 비용을 먼저 낮춘 뒤에 볼 항목이다(ADR 0009 후속 작업).
  #
  # 상세는 load-tests/k6/results/260814-555-admit-rate-knee/report.md · ADR 0009 §3.5.
  admit-rate-per-second: ${QUEUE_ADMIT_RATE:12}

  # 폴링 주기 하한 산식 T ≥ N / R 의 R (ADR 0009 §3). N=10,000 이면 T = ceil(10,000/400) = 25초.
  #
  # ⚠️ R 은 상수가 아니라 동시 커넥션 수의 함수다. 같은 경로·같은 호스트·같은 이미지에서:
  #      커넥션 약  1,600 (#546, VU 783)     → 1,400 RPS
  #      커넥션    16,701 (#549 B-1, VU 1만) →   450 RPS
  # 대기 인원이 많을수록 커넥션이 늘어 R 이 떨어지는데 산식은 한산할 때 잰 R 을 쓰므로,
  # 정확히 붐빌 때 주기를 너무 짧게 지시한다 — 대기열이 스스로를 무너뜨린다.
  #
  # 이 값이 1400 이던 동안 #549 B-1 이 그 지점에서 무너졌다: 폴링 수요 1,250 RPS vs 실제 용량
  # 450 RPS, queue_status_unavailable 15.55%, 호스트 CPU 99.20%. Redis 는 CPU 3.89% 로 멀쩡했고
  # 게이트웨이가 CPU 를 못 잡아 Lettuce 가 클라이언트 쪽에서 타임아웃한 것이었다.
  # 400 으로 되돌린 B-2 는 unavailable 0.00%(0/147,807), 예매 RPS 19.60-21.00 으로 유효했다.
  #
  # 400 은 #529 seat-counts 포화점 396.75 RPS 에서 온 값이고, ADR 0009 의 처음 추정이 옳았다.
  # 올리려면 '올리려는 동시성에서' 실측해야 한다 — 저부하에서 잰 값을 넣으면 같은 함정이다.
  status-rps-capacity: ${QUEUE_STATUS_RPS_CAPACITY:400}

  # N=10,000 · R=400 이면 T=25초로 ADR §3과 일치한다. 대기 인원이 적을 때는 하한까지 줄여 체감을 개선한다.
  min-poll-seconds: 3
  max-poll-seconds: 60

  # prod Redis는 maxmemory 64mb + noeviction 이라 잔류 키가 곧 좌석 락 SET 거절이다(ADR 0008).
  # 6h = 오픈런 한 회차의 상한.
  waiting-ttl: 6h
  entry-token-ttl: 5m

  # 대기 인원(ZCARD) 로컬 캐시. 25초 다이얼에 수 초 낡은 값은 무해하고, 이 캐시가 없으면 폴링마다
  # Redis 명령이 하나 더 는다.
  waiting-count-cache-ttl: 10s

custom:
  security:
    permit-all: false
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). MVC 7개와 같은 경계를 쓴다.
  # 게이트웨이는 uri 라벨이 라우트 패턴으로 정규화되지 않고 `/**`·`UNKNOWN` 으로 뭉개진다
  # (#402 배포본 실측: uri 카디널리티 4). 그래서 켜도 버킷이 경로 수만큼 곱해지지 않는 대신,
  # 여기서 얻는 p95는 엔드포인트별이 아니라 인스턴스 전체를 합친 값이다 — 엔드포인트별 서버
  # 퍼센타일은 MVC 쪽(job=ticketrush-services)에서 본다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
