server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 요청을 60초 물린다. fail-closed는
      # '거절'이지 '무한 대기'가 아니다(ADR 0008). 게이트웨이는 전 서비스의 관문이라 여기서 물리면
      # 예매·좌석·티켓이 함께 멈춘다 — seat/performance-service가 같은 이유로 먼저 적용한 값이다.
      timeout: 1s
      connect-timeout: 1s

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://${services.user.host}:8081
              predicates:
                - Path=/api/v1/user/**,/v3/api-docs/user
              filters:
                - RewritePath=/v3/api-docs/user,/v3/api-docs

            - id: auth-service
              uri: http://${services.auth.host}:8082
              predicates:
                - Path=/api/v1/auth/**,/api/v1/dev/auth/**,/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth,/v3/api-docs

            - id: performance-service
              uri: http://${services.performance.host}:8083
              predicates:
                - Path=/api/v1/performance/**,/v3/api-docs/performance
              filters:
                - RewritePath=/v3/api-docs/performance,/v3/api-docs

            - id: booking-service
              uri: http://${services.booking.host}:8084
              predicates:
                - Path=/api/v1/booking/**,/v3/api-docs/booking
              filters:
                - RewritePath=/v3/api-docs/booking,/v3/api-docs

            - id: payment-service
              uri: http://${services.payment.host}:8085
              predicates:
                - Path=/api/v1/payment/**,/v3/api-docs/payment
              filters:
                - RewritePath=/v3/api-docs/payment,/v3/api-docs

            - id: seat-sse-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/*/seat-status/stream
              metadata:
                response-timeout: -1
                connect-timeout: 5000

            - id: seat-service
              uri: http://${services.seat.host}:8086
              predicates:
                - Path=/api/v1/seat/**,/v3/api-docs/seat
              filters:
                - RewritePath=/v3/api-docs/seat,/v3/api-docs

            - id: ticket-service
              uri: http://${services.ticket.host}:8087
              predicates:
                # /api/v1/entries/** = 입장 검표(verify·check-in). ticket-service SecurityConfig가
                # hasRole("ADMIN")을 걸고 GatewayHeaderFilter가 게이트웨이 주입 헤더로 인증하는 설계인데
                # 라우트가 없어 외부에서 도달 자체가 불가능했다(인터넷에 열린 포트는 게이트웨이 8080뿐).
                - Path=/api/v1/ticket/**,/api/v1/entries/**,/v3/api-docs/ticket
              filters:
                - RewritePath=/v3/api-docs/ticket,/v3/api-docs

# 각 서비스의 API docs를 Gateway에서 통합
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user
      - name: auth-service
        url: /v3/api-docs/auth
      - name: performance-service
        url: /v3/api-docs/performance
      - name: booking-service
        url: /v3/api-docs/booking
      - name: payment-service
        url: /v3/api-docs/payment
      - name: seat-service
        url: /v3/api-docs/seat
      - name: ticket-service
        url: /v3/api-docs/ticket

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간(ms)
  refresh-token-expiration: 1209600000  # 14일(ms)

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

# 대기열 (#472 / ADR 0009 — 1만 VU 유입 제어)
queue:
  # 켜는 순간 POST /api/v1/booking 이 입장 토큰 없는 기존 클라이언트에 전부 403이 된다. 프런트 연동
  # 전까지는 꺼 둔다. prod 롤백도 이 값 하나로 끝난다(재배포·DDL 없음).
  enabled: ${QUEUE_ENABLED:false}

  # 초당 입장 허용량. #344 실측(booking 단독 258 RPS에서 호스트 CPU 99.87%)의 한참 아래로 잡는다 —
  # 예매 경로 부하를 유입 규모와 무관하게 이 값으로 고정하는 것이 대기열의 목적이다.
  admit-rate-per-second: ${QUEUE_ADMIT_RATE:20}

  # 폴링 주기 하한 산식 T ≥ N / R 의 R (ADR 0009 §3).
  # #546에서 실측했다(2026-07-31) — 계단 200/400/800/1600 RPS 중 1600에서 무릎.
  # 실제 RPS가 목표의 87.5%로 꺾이고 dropped가 39,634건으로 급증했으며 호스트 CPU 90.7%.
  # 직전 값 400(= #529 seat-counts 포화점을 빌린 보수적 하한)보다 3.5배 컸다 — DB를 타지 않는
  # 경로라 그럴 수밖에 없다는 ADR의 예상이 방향은 맞았고 폭이 컸다.
  # N=10,000 이면 T = ceil(10,000/1,400) = 8초.
  # ⚠️ 이 값은 nginx worker_connections 를 768 → 16,384 로 올린 뒤의 수치이고, 1600 계단에서 k6 VU가
  # maxVUs 800에 닿았다 — '이 구성에서 도달한 값'이지 경로의 절대 상한이 아니다.
  status-rps-capacity: ${QUEUE_STATUS_RPS_CAPACITY:1400}

  # N=10,000 · R=400 이면 T=25초로 ADR §3과 일치한다. 대기 인원이 적을 때는 하한까지 줄여 체감을 개선한다.
  min-poll-seconds: 3
  max-poll-seconds: 60

  # prod Redis는 maxmemory 64mb + noeviction 이라 잔류 키가 곧 좌석 락 SET 거절이다(ADR 0008).
  # 6h = 오픈런 한 회차의 상한.
  waiting-ttl: 6h
  entry-token-ttl: 5m

  # 대기 인원(ZCARD) 로컬 캐시. 25초 다이얼에 수 초 낡은 값은 무해하고, 이 캐시가 없으면 폴링마다
  # Redis 명령이 하나 더 는다.
  waiting-count-cache-ttl: 10s

custom:
  security:
    permit-all: false
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). MVC 7개와 같은 경계를 쓴다.
  # 게이트웨이는 uri 라벨이 라우트 패턴으로 정규화되지 않고 `/**`·`UNKNOWN` 으로 뭉개진다
  # (#402 배포본 실측: uri 카디널리티 4). 그래서 켜도 버킷이 경로 수만큼 곱해지지 않는 대신,
  # 여기서 얻는 p95는 엔드포인트별이 아니라 인스턴스 전체를 합친 값이다 — 엔드포인트별 서버
  # 퍼센타일은 MVC 쪽(job=ticketrush-services)에서 본다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
