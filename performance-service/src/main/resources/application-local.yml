springdoc:
  swagger-ui:
    enabled: true
  servers:
    - url: http://localhost:8083
      description: 로컬 서버

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticket_rush
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  kafka:
    bootstrap-servers: localhost:29092
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    aws:
      credentials:
        access-key: local-dummy-key
        secret-key: local-dummy-secret
      s3:
        # 로컬은 docker-compose의 LocalStack에 붙는다. 가상 호스트 방식(bucket.s3.amazonaws.com)은
        # 로컬 DNS로 풀리지 않으므로 path-style을 켠다.
        endpoint: http://localhost:4566
        path-style-access-enabled: true

app:
  s3:
    bucket: ticket-rush-local-bucket
    public-base-url: http://localhost:4566/ticket-rush-local-bucket
