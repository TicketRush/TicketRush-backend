server:
  port: 8083
  forward-headers-strategy: framework
  # Boot 2.2 부터 기본값이 false 라 톰캣 ThreadPool MBean 이 등록되지 않고, Micrometer 의
  # tomcat.threads.* 바인딩이 통째로 빈다(#500). 스레드 포화를 수치로 볼 수단이라 켠다.
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: performance-service
  jpa:
    open-in-view: false
  cache:
    type: redis
  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 캐시 fail-open을 무력화한다 — 짧게 자른다.
      # 같은 ConnectionFactory를 쓰는 ShedLock에도 적용됨: Redis 지연 스파이크 시 unlock 타임아웃으로
      # 락이 lockAtMostFor(1m)까지 잔존할 빈도가 소폭 늘 수 있는 트레이드오프를 수용한 값이다.
      timeout: 1s
      connect-timeout: 1s
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

app:
  event-publisher:
    type: kafka
  kafka:
    topics:
      performance-events:
        partitions: 1
        replicas: 1

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8083}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, user/auth 서비스와 동일). 분리하려면 SecurityConfig의 필터 순서
    # (gateway 먼저 → internal 나중)를 함께 검토해야 한다.
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). percentiles-histogram(true)은 Micrometer 사전정의
  # 버킷을 깔아 le 수를 통제할 수 없어 쓰지 않는다 — 앱 8개가 mem_limit 384m Prometheus 하나로
  # 모인다(ADR 0007). slo만 주면 버킷 = 지정 11개 + Inf 로 고정된다. 하단이 촘촘한 근거는 #402
  # 실측 서버측 평균(qr 1.30 / verify 4.27 / check-in 11.65ms)이다. Duration은 정수만 받는다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
