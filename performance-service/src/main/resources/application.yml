server:
  port: 8083
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: performance-service
  jpa:
    open-in-view: false
  cache:
    type: redis
  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 캐시 fail-open을 무력화한다 — 짧게 자른다.
      # 같은 ConnectionFactory를 쓰는 ShedLock에도 적용됨: Redis 지연 스파이크 시 unlock 타임아웃으로
      # 락이 lockAtMostFor(1m)까지 잔존할 빈도가 소폭 늘 수 있는 트레이드오프를 수용한 값이다.
      timeout: 1s
      connect-timeout: 1s
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

app:
  event-publisher:
    type: kafka
  kafka:
    topics:
      performance-events:
        partitions: 1
        replicas: 1

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8083}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, user/auth 서비스와 동일). 분리하려면 SecurityConfig의 필터 순서
    # (gateway 먼저 → internal 나중)를 함께 검토해야 한다.
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
