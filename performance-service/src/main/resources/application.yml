server:
  port: 8083
  forward-headers-strategy: framework
  # Boot 2.2 부터 기본값이 false 라 톰캣 ThreadPool MBean 이 등록되지 않고, Micrometer 의
  # tomcat.threads.* 바인딩이 통째로 빈다(#500). 스레드 포화를 수치로 볼 수단이라 켠다.
  tomcat:
    mbeanregistry:
      enabled: true

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: performance-service
  jpa:
    open-in-view: false
  cache:
    type: redis
  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 캐시 fail-open을 무력화한다 — 짧게 자른다.
      # 같은 ConnectionFactory를 쓰는 ShedLock에도 적용됨: Redis 지연 스파이크 시 unlock 타임아웃으로
      # 락이 lockAtMostFor(1m)까지 잔존할 빈도가 소폭 늘 수 있는 트레이드오프를 수용한 값이다.
      timeout: 1s
      connect-timeout: 1s
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

# 관리자 대시보드 집계(#563)가 쓰는 아웃바운드 호출. 내부 API는 게이트웨이가 라우팅하지 않으므로
# 대상 서비스의 '직접' 주소여야 한다(ADR 0002).
service:
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8084}
    # 두 호출 모두 전건 GROUP BY 집계라 단건 조회 선례(1s/2s)보다 read를 길게 잡는다.
    # 관리자 경로라 호출 빈도가 낮아 톰캣 스레드를 오래 잡는 위험도 그만큼 작다.
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
  seat:
    url: ${SEAT_SERVICE_URL:http://localhost:8086}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000

app:
  event-publisher:
    type: kafka
  kafka:
    topics:
      # 1을 유지한다(#596 판단). 컨슈머 병렬도를 3으로 올렸지만(KafkaConfig) 이 토픽만 예외로
      # 남는다 — 파티션이 1이면 스레드를 몇 개 띄워도 하나만 할당받고 나머지는 논다.
      #
      # 그래도 올리지 않는 이유: 공연 등록은 관리자가 어쩌다 한 번 부르는 저빈도 경로라 예매
      # 핫패스가 아니다. #596 이 푸는 문제는 "3파티션 토픽을 1스레드가 먹는다"는 것이고, 이 토픽은
      # 애초에 그 상황이 아니다.
      #
      # 올릴 때 유의할 점: 이 값은 NewTopic 빈(KafkaTopicConfig)이 '생성 시점'에만 쓴다. 이미
      # 만들어진 토픽의 파티션은 바뀌지 않으므로 kafka-topics --alter 가 따로 필요하다. 코드
      # 수정은 필요 없고 이 값(또는 환경변수)만 바꾸면 된다.
      performance-events:
        partitions: 1
        replicas: 1

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8083}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, user/auth 서비스와 동일). 분리하려면 SecurityConfig의 필터 순서
    # (gateway 먼저 → internal 나중)를 함께 검토해야 한다.
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). percentiles-histogram(true)은 Micrometer 사전정의
  # 버킷을 깔아 le 수를 통제할 수 없어 쓰지 않는다 — 앱 8개가 mem_limit 384m Prometheus 하나로
  # 모인다(ADR 0007). slo만 주면 버킷 = 지정 11개 + Inf 로 고정된다. 하단이 촘촘한 근거는 #402
  # 실측 서버측 평균(qr 1.30 / verify 4.27 / check-in 11.65ms)이다. Duration은 정수만 받는다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
