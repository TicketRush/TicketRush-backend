server:
  port: 8083
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: performance-service
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

app:
  event-publisher:
    type: kafka
  kafka:
    topics:
      performance-events:
        partitions: 1
        replicas: 1

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8083}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 내부 API 토큰. gateway.internal-token과 동일한 GATEWAY_INTERNAL_TOKEN 시크릿을 의도적으로 공유한다
    # (게이트웨이↔서비스 공유 시크릿 재사용, user/auth 서비스와 동일). 분리하려면 SecurityConfig의 필터 순서
    # (gateway 먼저 → internal 나중)를 함께 검토해야 한다.
    internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
