server:
  port: 8083
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: performance-service
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false

app:
  event-publisher:
    type: kafka
  kafka:
    topics:
      performance-events:
        partitions: 1
        replicas: 1

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8083}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
