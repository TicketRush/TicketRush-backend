spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

  # test 프로파일은 Redis가 없어 캐시를 끈다 (캐시 검증은 Testcontainers 테스트가 redis로 오버라이드)
  cache:
    type: none

# 아웃바운드 호출 대상을 빈 값으로 덮어 테스트가 실제 HTTP를 시도하지 않게 한다.
# 기본값(http://localhost:8086 등)이 살아 있으면 ServiceUrlValidator를 통과해 버려,
# 목록을 태우는 통합 테스트가 mock 대체를 빠뜨리는 순간 조용히 실제 호출이 나간다.
# fail-open이라 결과는 통과하므로 그 포트에 무언가 떠 있을 때만 비결정적으로 드러난다.
service:
  seat:
    url:
  booking:
    url:

app:
  # S3Properties 는 @Validated @NotBlank 라 값이 없으면 컨텍스트 로딩 자체가 실패한다.
  # 테스트는 실제 S3 를 부르지 않지만(호출부를 mock 하거나 LocalStack 으로 덮는다) 바인딩은 통과해야 한다.
  s3:
    bucket: test-bucket
    public-base-url: https://test-bucket.s3.ap-northeast-2.amazonaws.com
  event-publisher:
    type: kafka
  scheduler:
    enabled: false