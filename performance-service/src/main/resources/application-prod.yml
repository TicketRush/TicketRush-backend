spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # local은 무인증 Redis라 prod 프로파일에만 둔다(ADR 0008).
      password: ${REDIS_PASSWORD}
  cloud:
    aws:
      # 운영은 IAM 인스턴스 롤 사용 권장(access/secret 미주입 시 DefaultCredentialsProvider로 폴백).
      credentials:
        access-key: ${AWS_S3_ACCESS_KEY:}
        secret-key: ${AWS_S3_SECRET_KEY:}

# 버킷명은 spring.cloud.aws.s3.bucket 이 아니라 여기서 읽는다 — 그 키는 awspring 4.0.0 이 인식하지
# 않아 어떤 빈도 바인딩하지 않는다(#636, S3Properties 주석 참고).
#
# 다른 필수 시크릿과 같이 기본값 없이 둔다: 미주입이면 기동에 실패한다. 버킷명 없이 뜨면
# "등록은 201 인데 파일은 저장되지 않는" 상태가 되는데, 그것이 #636 이 고치려는 증상이다.
# 배포 전 .env 에 AWS_S3_BUCKET 반영이 선행 조건이다.
app:
  s3:
    bucket: ${AWS_S3_BUCKET}
    # 버킷 퍼블릭 읽기 정책 전제. 비어 있으면 버킷·리전으로 조립하므로(S3Properties) 보통은 주입하지 않는다.
    # CloudFront 를 붙일 때만 CDN 도메인을 넣는다.
    #
    # 여기에 ${VAR:default} 로 기본값을 두지 않는 이유: .env 의 빈 줄은 '미정의'가 아니라 '빈 문자열' 로
    # 들어와 기본값이 적용되지 않는다. 조립은 코드에서 blank 를 보고 처리한다.
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}

# base의 localhost 기본값을 '빈 값'으로 덮는다. 운영 컨테이너에서 localhost는 자기 자신이라,
# 변수가 안 들어왔을 때 base 기본값이 살아 있으면 performance가 자기 자신에게 예매 집계를 물어
# 404를 받고 조용히 깨진다. 빈 값이면 호출 자체를 하지 않고 대시보드의 해당 필드만 null이 된다.
#
# 다른 서비스처럼 ${VAR}(기본값 없음)로 두지 않는 이유: 그러면 변수 미주입이 곧 기동 실패인데,
# 이 호출들은 관리자 대시보드 전용이라 사용자 공개 API(공연 목록·상세)까지 함께 죽일 이유가 없다.
# 설정 누락은 기동 로그의 경고로 드러낸다(RestClientConfig).
service:
  booking:
    url: ${BOOKING_SERVICE_URL:}
  seat:
    url: ${SEAT_SERVICE_URL:}

gateway:
  # 운영은 게이트웨이 내부 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

custom:
  security:
    # 운영은 내부 API 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    internal-token: ${INTERNAL_API_TOKEN}
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

# actuator를 앱 포트에서 분리한다. gateway의 8080은 인터넷에 열려 있고 SecurityConfig가
# permitAll이라, 분리하지 않으면 /actuator/prometheus 가 인증 없이 공개된다(ADR 0007).
# 8090은 compose에서 publish 하지 않으므로 같은 네트워크의 Prometheus만 접근할 수 있다.
# prod 에만 둔다. application.yml 에 두면 로컬에서 앱 8개가 8090을 다퉈 기동이 실패한다.
management:
  server:
    port: 8090
