server:
  port: 8082
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: auth-service
  jpa:
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

oauth:
  kakao:
    authorization-uri: https://kauth.kakao.com/oauth/authorize
    auth-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    user-name-attribute: id

  google:
    authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
    auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo


  naver:
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me
    user-name-attribute: response

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8082}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    permit-all: false
    internal-token: ${INTERNAL_API_TOKEN}
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

service:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  http:
    connect-timeout-ms: ${SERVICE_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SERVICE_HTTP_READ_TIMEOUT_MS:10000}

app:
  event-publisher:
    type: kafka

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000      # 1시간(ms)
  refresh-token-expiration: 1209600000  # 14일(ms)

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). percentiles-histogram(true)은 Micrometer 사전정의
  # 버킷을 깔아 le 수를 통제할 수 없어 쓰지 않는다 — 앱 8개가 mem_limit 384m Prometheus 하나로
  # 모인다(ADR 0007). slo만 주면 버킷 = 지정 11개 + Inf 로 고정된다. 하단이 촘촘한 근거는 #402
  # 실측 서버측 평균(qr 1.30 / verify 4.27 / check-in 11.65ms)이다. Duration은 정수만 받는다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
