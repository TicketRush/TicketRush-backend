spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}

  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}

gateway:
  # 운영은 게이트웨이 내부 토큰을 반드시 주입(base의 test-token 기본값 오버라이드, 미주입 시 fail-fast).
  internal-token: ${GATEWAY_INTERNAL_TOKEN}

custom:
  security:
    oauth2:
      allowed-redirect-domains:
        - ${OAUTH_ALLOWED_REDIRECT_DOMAIN}
    permit-urls:
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

# actuator를 앱 포트에서 분리한다. gateway의 8080은 인터넷에 열려 있고 SecurityConfig가
# permitAll이라, 분리하지 않으면 /actuator/prometheus 가 인증 없이 공개된다(ADR 0007).
# 8090은 compose에서 publish 하지 않으므로 같은 네트워크의 Prometheus만 접근할 수 있다.
# prod 에만 둔다. application.yml 에 두면 로컬에서 앱 8개가 8090을 다퉈 기동이 실패한다.
management:
  server:
    port: 8090
