server:
  port: 8086
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: seat-service
  jpa:
    open-in-view: false
  task:
    scheduling:
      pool:
        # @Scheduled 4개(relay·좌석 만료 fallback·outbox retention·held 게이지)가 스레드 하나를
        # 공유하면 하나가 블로킹될 때 나머지가 함께 밀린다. 특히 relay의 producer.send()가 브로커
        # 메타데이터 대기로 잡히면(KafkaConfig max.block.ms) 만료 fallback까지 멈춘다. 스케줄러 수만큼 준다.
        size: 4
  data:
    redis:
      # Lettuce 기본 커맨드 타임아웃(60s)은 hang형 Redis 장애 시 좌석 락 경로를 60초 물린다.
      # fail-closed는 '거절'이지 '무한 대기'가 아니다(ADR 0008) — 이 경로는 Kafka 리스너 스레드를
      # 잡으므로, 물려 있는 동안 poll이 밀려 컨슈머 리밸런싱으로 장애가 번진다. 짧게 자른다.
      # performance-service(application.yml:16-20)가 같은 이유로 먼저 적용한 값이다.
      #
      # 주의 — 이 값이 곧 실패까지의 벽시계 시간은 아니다. Redisson 스타터는 이 timeout을 응답
      # 타임아웃으로 매핑하지만 자체 retryAttempts(기본 3)·retryInterval(기본 1.5s)을 별도로 갖는다.
      # 즉 최악은 1초가 아니라 수 초다. 60초보다 훨씬 낫지만 "1초 차단"으로 읽으면 안 된다.
      #
      # 트레이드오프: 응답 타임아웃이 짧으면 부하·GC 스파이크에 unlock이 타임아웃날 수 있고,
      # 그러면 좌석 락이 SeatLockUseCase.LOCK_TTL_MINUTES(5분)까지 잔존해 그 좌석이 5분간 잠긴다.
      # performance-service가 ShedLock(1분) 기준으로 수용한 것과 같은 성질이되 잔존 시간이 5배다.
      # 정합성은 깨지지 않고(#427의 DB @Version) 가용성만 손해라 수용한다.
      timeout: 1s
      connect-timeout: 1s

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8086}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, performance/user/auth 서비스와 동일).
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

app:
  seat:
    release:
      # 청크의 첫 좌석에 걸린 행 잠금은 나머지 좌석의 UPDATE를 모두 지나 청크 커밋까지 유지된다.
      # 그 사이 같은 좌석의 결제 확정(confirmSoldById)이 블로킹되므로, 러시 중 경합을 줄이려 청크를 짧게 끊는다.
      # 대신 max-chunks를 함께 올려 tick당 처리 상한(2000건)은 유지한다. 이 경로는 Redis 만료 리스너가
      # 못 살린 좌석을 쓸어담는 fallback이라, 정작 일해야 하는 순간이 곧 대량 만료가 밀린 순간이다.
      chunk-size: 25
      max-chunks: 80
  event-publisher:
    type: outbox
  outbox:
    aggregate-types:
      - Seat
    # 발행 상한 = batch-size / 릴레이 주기(5초). 100이면 20/s 인데, 대량 만료 시 이벤트 생성률이
    # 33.3/s(tick당 2,000건 / 60초)라 적체가 단조 증가했다(#345 실측: backlog 피크 5,200,
    # 좌석 해제 완료 후로도 8분간 미발행). 300 이면 이론 상한이 60/s 로 생성률 위에 온다. 실효 발행률은
    # 콜백 처리율(OutboxStatusUpdater 가 프로듀서 IO 스레드 하나에서 직렬로 돈다)에 묶일 수 있어
    # 상한보다 낮을 수 있다 — 재측정으로 확인한다. 주기가 아니라 이 값을
    # 올리는 이유는 OutboxRelayScheduler 주석 참고. 조회 윈도(LIMIT batch-size)의 in-flight 슬롯
    # 여유도 함께 커지지만, 한 배치가 붙잡는 커넥션·프로듀서 버퍼도 같이 커진다 — 그 트레이드오프는
    # 재측정으로 확인한다(#489).
    batch-size: 300
    max-retries: 3
    retention-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
  # 서버 관점 p95/p99용 히스토그램 버킷(#495). percentiles-histogram(true)은 Micrometer 사전정의
  # 버킷을 깔아 le 수를 통제할 수 없어 쓰지 않는다 — 앱 8개가 mem_limit 384m Prometheus 하나로
  # 모인다(ADR 0007). slo만 주면 버킷 = 지정 11개 + Inf 로 고정된다. 하단이 촘촘한 근거는 #402
  # 실측 서버측 평균(qr 1.30 / verify 4.27 / check-in 11.65ms)이다. Duration은 정수만 받는다.
  metrics:
    distribution:
      slo:
        http.server.requests: 1ms,2ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
