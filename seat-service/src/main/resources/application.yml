server:
  port: 8086
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: seat-service
  jpa:
    open-in-view: false

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost:${server.port:8086}}
  swagger:
    serverUrl: ${SWAGGER_SERVER_URL:http://localhost:8080}
  security:
    # 서비스 간 내부 API 호출에 사용하는 전용 토큰
    # (게이트웨이↔서비스 공유 시크릿 재사용, performance/user/auth 서비스와 동일).
    internal-token: ${INTERNAL_API_TOKEN:test-internal-token}
    permit-all: false
    permit-urls:
      # ========== 개발 도구 ==========
      - /h2-console/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /
      - /favicon.ico
      - /error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

app:
  seat:
    release:
      # 청크의 첫 좌석에 걸린 행 잠금은 나머지 좌석의 UPDATE를 모두 지나 청크 커밋까지 유지된다.
      # 그 사이 같은 좌석의 결제 확정(confirmSoldById)이 블로킹되므로, 러시 중 경합을 줄이려 청크를 짧게 끊는다.
      # max-chunks와 곱해 tick당 처리 상한은 500건이다.
      chunk-size: 25
      max-chunks: 20
  event-publisher:
    type: outbox
  outbox:
    aggregate-types:
      - Seat
    batch-size: 100
    max-retries: 3
    retention-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
