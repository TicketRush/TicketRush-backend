server:
  port: 8086
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: seat-service

custom:
  global:
    internalBackUrl: http://localhost:${server.port:8086}
  swagger:
    serverUrl: http://localhost:8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN:test-token}

app:
  seat:
    release:
      chunk-size: 100
      max-chunks: 20

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never