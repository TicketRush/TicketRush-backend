# AWS 단일 EC2 배포본 오버레이. base(docker-compose.yml)의 인프라 4종 위에
# MySQL과 앱 8개를 얹어 컨테이너 13개를 구성한다.
#
#   기동: docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d
#   빌드: docker compose -f docker-compose.yml -f docker-compose.aws.yml build
#
# 근거 SSOT: docs/adr/0004-load-test-execution-topology.md
# 배포 절차: docs/aws-deploy-guide.md
#
# ⚠️ cpus 상한 합계는 4.5(앱 8×0.5 + prometheus 0.3 + grafana 0.2)로 m7i.xlarge의 4 vCPU를 넘는다.
#    cpus는 예약이 아니라 상한이므로 기동은 되지만, 부하 피크에서는 앱끼리 CPU를 다툰다.
#    측정 중에는 Grafana 대시보드를 열어두지 않는다(패널 쿼리가 측정 대상의 CPU를 먹는다).

# 앱 8개 공통. gateway는 DB/Kafka/Redis를 쓰지 않아 depends_on을 따로 정의한다.
x-app: &app
  build:
    context: .
  env_file:
    - .env.aws
  mem_limit: 1g # 실효 힙 768m (Dockerfile의 MaxRAMPercentage=75)
  cpus: 0.5
  restart: unless-stopped
  networks:
    - ticketrush-net

x-app-depends: &app-depends
  mysql:
    condition: service_healthy
  kafka:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 90s

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    command: [ "--innodb-buffer-pool-size=768M" ]
    # compose 파일의 ${VAR} 보간은 env_file이 아니라 셸 환경/.env 에서 읽는다.
    # MYSQL_ROOT_PASSWORD 등을 environment에 ${...}로 적으면 빈 값이 되어 초기화가 실패한다.
    # env_file로 직접 주입하고, MySQL 이미지가 읽는 키(MYSQL_DATABASE·MYSQL_USER)는 .env.aws에 둔다.
    env_file:
      - .env.aws
    volumes:
      - mysql_data:/var/lib/mysql
      # 최초 기동 시(mysql_data 볼륨이 비어 있을 때) 1회만 실행된다.
      # 스키마를 갈아끼우려면 `docker compose ... down -v`로 볼륨을 지워야 한다.
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 는 compose 이스케이프. 컨테이너 안에서 $MYSQL_ROOT_PASSWORD 로 평가된다
      # (compose가 보간하면 비번이 빈 값이 되고 `compose config` 출력에도 평문으로 남는다).
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1.5g
    networks:
      - ticketrush-net

  # 관측 스택은 base를 그대로 쓰되, scrape 타깃만 컨테이너 서비스명 기반으로 교체한다.
  prometheus:
    volumes:
      - ./monitoring/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # 유일한 외부 노출 지점. 나머지 7개 서비스는 compose 네트워크 안에서만 접근된다.
  gateway-service:
    <<: *app
    image: ghcr.io/ticketrush/gateway-service:latest
    build:
      context: .
      args:
        SERVICE: gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      performance-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      seat-service:
        condition: service_healthy
      ticket-service:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]

  user-service:
    <<: *app
    image: ghcr.io/ticketrush/user-service:latest
    build:
      context: .
      args:
        SERVICE: user-service
    container_name: user-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]

  auth-service:
    <<: *app
    image: ghcr.io/ticketrush/auth-service:latest
    build:
      context: .
      args:
        SERVICE: auth-service
    container_name: auth-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]

  performance-service:
    <<: *app
    image: ghcr.io/ticketrush/performance-service:latest
    build:
      context: .
      args:
        SERVICE: performance-service
    container_name: performance-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]

  booking-service:
    <<: *app
    image: ghcr.io/ticketrush/booking-service:latest
    build:
      context: .
      args:
        SERVICE: booking-service
    container_name: booking-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]

  payment-service:
    <<: *app
    image: ghcr.io/ticketrush/payment-service:latest
    build:
      context: .
      args:
        SERVICE: payment-service
    container_name: payment-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]

  seat-service:
    <<: *app
    image: ghcr.io/ticketrush/seat-service:latest
    build:
      context: .
      args:
        SERVICE: seat-service
    container_name: seat-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]

  ticket-service:
    <<: *app
    image: ghcr.io/ticketrush/ticket-service:latest
    build:
      context: .
      args:
        SERVICE: ticket-service
    container_name: ticket-service
    depends_on: *app-depends
    healthcheck:
      <<: *app-healthcheck
      test: [ "CMD", "curl", "-f", "http://localhost:8087/actuator/health" ]

volumes:
  mysql_data:
